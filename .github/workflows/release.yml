name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Select release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - no-increment
      dry_run:
        description: Enable dry run
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.ref || github.ref }}
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v6
        with:
          token: ${{ secrets.GH_DOTCOM_TOKEN }}
          node-version: 26

      - name: Bun install
        run: bun install

      - name: Run release
        run: |
          if [ "${{ inputs.release_type }}" = "no-increment" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              bun run --bun release-it --increment=false --ci --dry-run --git.requireCleanWorkingDir=false
            else
              bun run --bun release-it --increment=false --ci --git.requireCleanWorkingDir=false
            fi
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              bun run release:${{ inputs.release_type }} --ci --dry-run --git.requireCleanWorkingDir=false
            else
              bun run release:${{ inputs.release_type }} --ci --git.requireCleanWorkingDir=false
            fi
          fi
